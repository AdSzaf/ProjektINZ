version: '3.9'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: inz_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules  # This prevents node_modules from being overwritten
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    # Remove the duplicate command since it's already in Dockerfile

  stripe:
    image: stripe/stripe-cli:latest
    command: >
      listen --forward-to http://backend:8000/api/payments/webhook/
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY} 
    depends_on:
      - backend
  
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_ai
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped

  ngrok:
    image: wernight/ngrok
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ngrok http backend:8000
    ports:
      - "4040:4040"

volumes:
  pgdata:
  ollama_data: