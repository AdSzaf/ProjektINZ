version: '3.9'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: inz_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules  # This prevents node_modules from being overwritten
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    # Remove the duplicate command since it's already in Dockerfile

volumes:
  pgdata: